# 윈도우·맥 바이너리를 한 번에 만든다.
#
# 이게 GitHub 을 쓰는 진짜 이유다: 맥 바이너리는 맥에서만 만들 수 있는데(메뉴바가 cgo 를 거친다)
# macos-latest 러너가 그 맥이 되어 준다. 맥을 갖고 있지 않아도 맥용 .app 이 나온다.
#
#   푸시·PR  → 빌드만 하고 아티팩트로 남긴다(7일 보관)
#   태그 v*  → 릴리스를 만들고 파일을 붙인다. 이게 남들에게 줄 다운로드 링크다.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 릴리스 업로드에 필요

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: 빌드
        shell: bash
        env:
          CGO_ENABLED: '0' # 윈도우는 cgo 없이 빌드된다 = 컴파일러 불필요
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          go test ./...
          go test fyne.io/systray
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.appVersion=$APP_VERSION" -o dist/usage-tray.exe .
          ls -la dist
      - name: 스모크 테스트
        shell: bash
        run: ./dist/usage-tray.exe -icons dist/icons && ls dist/icons | head -3
        # 자격증명이 없는 러너에서도 도는 유일한 경로다. -once 는 '에이전트 없음' 으로 끝난다.
      - name: Windows 배포 압축
        shell: pwsh
        run: Compress-Archive -Path dist/usage-tray.exe,THIRD_PARTY_NOTICES.txt -DestinationPath dist/UsageTray-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: usage-tray-windows-amd64
          path: |
            dist/usage-tray.exe
            dist/UsageTray-windows-amd64.zip
          retention-days: 7
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: 빌드 (유니버설 .app)
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          go test ./...
          chmod +x build.sh
          ./build.sh
          ls -la dist
      - name: 스모크 테스트
        run: ./dist/usage-tray -icons dist/icons && ls dist/icons | head -3
      - name: .app 압축
        run: cd dist && zip -r UsageTray-macos-universal.zip UsageTray.app
      - uses: actions/upload-artifact@v4
        with:
          name: usage-tray-macos-universal
          path: dist/UsageTray-macos-universal.zip
          retention-days: 7
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: 서식·정적 검사
        run: |
          files="$(git ls-files '*.go' | grep -v '^vendor/')"
          test -z "$(gofmt -l $files)" || { echo '서식 불일치:'; gofmt -l $files; exit 1; }
          go vet ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: usage-tray-*
          path: dist
          merge-multiple: true
      - name: 배포 파일과 안내 확인
        run: |
          test -s dist/usage-tray.exe
          test -s dist/UsageTray-windows-amd64.zip
          test -s dist/UsageTray-macos-universal.zip
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - name: 릴리스 게시
        uses: softprops/action-gh-release@v2
        with:
          name: Usage Tray ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/usage-tray.exe
            dist/UsageTray-windows-amd64.zip
            dist/UsageTray-macos-universal.zip
            THIRD_PARTY_NOTICES.txt
